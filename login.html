<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Master | Iniciar sesión</title>
    <style>
        :root {
            --gold: #d5ad3d;
            --dark: #11100f;
            --panel: #1b1917;
            --muted: #aaa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            color: white;
            background: var(--dark);
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: min(100%, 420px);
            padding: 36px;
            background: var(--panel);
            border: 1px solid rgba(213, 173, 61, .35);
            border-radius: 12px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
        }

        h1 {
            margin: 0;
            color: var(--gold);
            font-size: 24px;
            letter-spacing: 2px;
            text-align: center;
        }

        .subtitle {
            margin: 10px 0 28px;
            color: var(--muted);
            text-align: center;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            color: white;
            background: #111;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid var(--gold);
            border-color: var(--gold);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            color: #111;
            background: var(--gold);
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        button:disabled {
            cursor: wait;
            opacity: .65;
        }

        .message {
            min-height: 22px;
            margin: 16px 0 0;
            color: #f28b82;
            text-align: center;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: var(--gold);
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>BARBER MASTER</h1>
        <p class="subtitle">Portal para barberos</p>

        <form id="loginForm">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button id="loginButton" type="submit">INICIAR SESIÓN</button>
            <p id="message" class="message" role="alert"></p>
        </form>

        <a class="back-link" href="index.html">Volver al inicio</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://nxfkpmjfopwdlblahlix.supabase.co";
        const SUPABASE_KEY = "sb_publishable_UpfXLFD4dPyhezCh8bQ7aQ_E0viD5zV";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";
            button.disabled = true;

            const { error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            });

            if (error) {
                message.textContent = error.message;
                button.disabled = false;
                return;
            }

            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
